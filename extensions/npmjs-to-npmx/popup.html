<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>npmjs to npmx</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>npmjs to<br />npmx</strong>
      <span>Redirect compatible npmjs.com pages to npmx.dev.</span>
      <img class="header-art" src="icons/icon-128.png" alt="" />
    </header>
    <main>
      <label class="master">
        <span><strong>Redirects</strong><small>All supported routes</small></span>
        <input type="checkbox" name="enabled" />
      </label>
      <fieldset>
        <legend>Routes</legend>
        <label
          ><span>Packages<small>/package/*</small></span
          ><input type="checkbox" name="packages"
        /></label>
        <label
          ><span>Search<small>/search</small></span
          ><input type="checkbox" name="search"
        /></label>
        <label
          ><span>Users<small>/~username</small></span
          ><input type="checkbox" name="users"
        /></label>
        <label
          ><span>Organizations<small>/org/*</small></span
          ><input type="checkbox" name="organizations"
        /></label>
      </fieldset>
      <p id="settings-status" role="status" aria-live="polite"></p>
    </main>
    <footer>Type <kbd>npmx</kbd> + <kbd>Tab</kbd> in address bar.</footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
