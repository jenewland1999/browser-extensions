<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading List Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Reading List<br />Manager</strong>
      <span>Import, export, or clear your saved pages.</span>
      <i class="header-art" aria-hidden="true"><b></b><b></b><b></b></i>
    </header>
    <main>
      <section class="total" aria-label="Reading List total">
        <span><strong id="count">—</strong> saved items</span>
        <small id="summary">Loading...</small>
      </section>
      <p class="section-label">Actions</p>
      <input id="import-file" type="file" accept=".html,.htm,text/html" hidden />
      <button id="import" type="button">
        <span class="icon import-icon" aria-hidden="true"></span>
        <span><strong>Import</strong><small>Add bookmarks HTML to Reading List</small></span>
      </button>
      <button id="export" type="button" disabled>
        <span class="icon export-icon" aria-hidden="true"></span>
        <span><strong>Export</strong><small>Save Raindrop-compatible HTML</small></span>
      </button>
      <button id="delete" class="danger" type="button" disabled>
        <span class="icon clear-icon" aria-hidden="true"></span>
        <span><strong>Delete / Clear</strong><small>Remove every Reading List item</small></span>
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
