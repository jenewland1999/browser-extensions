name: Canary release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Publish canary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Calculate canary version
        id: version
        run: node scripts/release-version.js canary --ref "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_SHA: ${{ github.sha }}

      - name: Build release assets
        run: >-
          pnpm run build:release --
          --tag "$RELEASE_TAG"
          --browser-version "$BROWSER_VERSION"
          --version-name "$VERSION_NAME"
          --output-directory "$RELEASE_ASSET_DIRECTORY"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BROWSER_VERSION: ${{ steps.version.outputs.browser_version }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_ASSET_DIRECTORY: ${{ runner.temp }}/release-assets

      - name: Publish GitHub prerelease
        run: |
          shopt -s nullglob
          assets=("$RELEASE_ASSET_DIRECTORY"/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were built." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --latest=false \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_STABLE_TAG" \
            --notes "Automated canary build of commit \`$RELEASE_SHA\`."

          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "Promote this candidate with the **Stable release** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          PREVIOUS_STABLE_TAG: ${{ steps.version.outputs.previous_stable_tag }}
          RELEASE_ASSET_DIRECTORY: ${{ runner.temp }}/release-assets
