name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Verify archive contents
        run: |
          test "$(unzip -Z1 extensions/npmjs-to-npmx/dist/npmjs-to-npmx.zip | sort)" = "$(printf '%s\n' \
            background.js content.js icons/icon-128.png icons/icon-16.png \
            icons/icon-32.png icons/icon-48.png manifest.json popup.css popup.html \
            popup.js redirect.js rules/organizations.json rules/packages.json \
            rules/search.json rules/users.json settings.js | sort)"
