name: Stable release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Canary tag to promote, for example v1.2.0-canary.4
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable release
    runs-on: ubuntu-latest

    steps:
      - name: Require the default branch workflow
        run: |
          if [[ "$WORKFLOW_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
        env:
          WORKFLOW_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Calculate stable version
        id: version
        run: >-
          node scripts/release-version.mjs stable
          --candidate "$CANDIDATE_TAG"
          --main-ref "origin/$DEFAULT_BRANCH"
          >> "$GITHUB_OUTPUT"
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Verify canary prerelease
        run: |
          release_state=$(gh release view "$CANDIDATE_TAG" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv')

          if [[ "$release_state" != $'false\ttrue' ]]; then
            echo "$CANDIDATE_TAG is not a published GitHub prerelease." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.version.outputs.candidate_tag }}

      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.version.outputs.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Build release assets
        run: >-
          pnpm run build:release --
          --tag "$RELEASE_TAG"
          --browser-version "$BROWSER_VERSION"
          --version-name "$VERSION_NAME"
          --output-directory "$RELEASE_ASSET_DIRECTORY"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BROWSER_VERSION: ${{ steps.version.outputs.browser_version }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_ASSET_DIRECTORY: ${{ runner.temp }}/release-assets

      - name: Publish GitHub release
        run: |
          shopt -s nullglob
          assets=("$RELEASE_ASSET_DIRECTORY"/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were built." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --latest \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_STABLE_TAG" \
            --notes "Promoted from canary release \`$CANDIDATE_TAG\`."

          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "Promoted from \`$CANDIDATE_TAG\` and marked as the latest release."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          CANDIDATE_TAG: ${{ steps.version.outputs.candidate_tag }}
          PREVIOUS_STABLE_TAG: ${{ steps.version.outputs.previous_stable_tag }}
          RELEASE_ASSET_DIRECTORY: ${{ runner.temp }}/release-assets
